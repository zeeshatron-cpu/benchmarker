# Fenzo benchmarker configuration.
#
# Copy to config.yaml and edit. With no config file at all, the pipeline falls
# back to an all-mock line-up so you can see the whole flow with zero setup:
#   python -m benchmarker record "How do I center a div?" --tags css
#   python -m benchmarker run

# The model whose responses we are evaluating. Everything is compared against it.
subject: fenzo

# The judge that scores answers. Uses the Anthropic SDK (ANTHROPIC_API_KEY or an
# `ant auth login` profile). If the SDK isn't installed, the pipeline
# automatically falls back to the offline heuristic judge.
judge:
  name: judge
  type: anthropic
  model: claude-opus-5

paths:
  queries: queries/queries.jsonl
  responses_log: logs/responses.jsonl
  comparisons_log: logs/comparisons.jsonl
  reports_dir: reports

# The line-up. `type` selects the adapter. Swap any `mock` entry for a real one.
models:
  # --- Fenzo AI: web-only, so we drive its UI with a headless browser. ---
  # Selectors below are the ones confirmed from Fenzo's DOM. Update `url` to the
  # real chat page and set `send_selector` if Enter doesn't submit.
  # To start with the mock while wiring things up, use `type: mock` here.
  - name: fenzo
    type: fenzo_web
    url: "https://app.fenzo.ai/chat"          # TODO: confirm the real chat URL
    input_selector: "#fenzo-input-box"         # confirmed: the prompt textarea
    send_selector: null                        # confirmed textarea; try Enter first,
                                               # set to the send button if Enter adds a newline
    response_selector: ".markdown-viewer"      # confirmed: rendered assistant reply
    ready_selector: null                       # e.g. a post-login element to await
    storage_state: "fenzo_auth.json"           # Playwright storage-state for login
    headless: true
    settle_ms: 500                             # initial grace before polling
    stable_ms: 1200                            # reply "done" once text is unchanged this long
    timeout_ms: 90000

  # --- Comparison LLMs via their APIs. ---
  - name: claude-opus-5
    type: anthropic
    model: claude-opus-5
    max_tokens: 2048

  - name: gpt-4o
    type: openai
    model: gpt-4o
    max_tokens: 2048

# Tip: capture a logged-in Fenzo session once with Playwright to produce
# fenzo_auth.json:
#   playwright codegen --save-storage=fenzo_auth.json https://app.fenzo.ai
